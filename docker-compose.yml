services:
  marp-collab:
    image: ghcr.io/alex289/marp-collab:latest
    container_name: marp-collab
    env_file: .env
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - ./data:/app/data
    depends_on:
      - gotenberg
  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: gotenberg
