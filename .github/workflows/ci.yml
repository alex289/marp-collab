name: CI

on:
  push:

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Use Node.js 26.x
        uses: actions/setup-node@v6
        with:
          node-version: 26.x
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile && cd backend && pnpm rebuild better-sqlite3

      - name: Run Linter
        run: node --run lint

      - name: Check Formatting
        run: node --run format:check

      - name: Type Checking
        run: node --run typecheck

      - name: Build
        run: node --run build
