name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}-main

permissions:
  contents: read

jobs:
  # Check if a release PR is needed and create it or if a release PR was merged
  prepare-release:
    name: Prepare Release PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      hasChangesets: ${{ steps.changesets.outputs.hasChangesets }}
      publishedPackages: ${{ steps.changesets.outputs.publishedPackages  }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Use Node.js 26.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.x
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile && cd backend && pnpm rebuild better-sqlite3

      - name: Create Release Pull Request
        uses: changesets/action@c48e67d110a68bc90ccf1098e9646092baacaa87
        id: changesets
        with:
          publish: npx @changesets/cli tag
          createGithubReleases: true
          commit: "chore(release): Version packages"
          title: "chore(release): Version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Print Changesets Outputs
        run: |
          echo "Has Changesets: ${{ steps.changesets.outputs.hasChangesets }}"
          echo "Published Packages: ${{ steps.changesets.outputs.publishedPackages }}"

  release:
    name: Publish Docker Images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: prepare-release
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/marp-collab
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.tag-name }},enable=${{ needs.release-please.outputs.new-release-created == 'true' }}
            type=semver,pattern={{major}}.{{minor}}.{{patch}},value=${{ needs.release-please.outputs.tag-name }},enable=${{ needs.release-please.outputs.new-release-created == 'true' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.tag-name }},enable=${{ needs.release-please.outputs.new-release-created == 'true' }}
            type=semver,pattern={{major}},value=${{ needs.release-please.outputs.tag-name }},enable=${{ needs.release-please.outputs.new-release-created == 'true' }}
            type=raw,value=latest,enable=${{ needs.release-please.outputs.new-release-created == 'true' }}
            type=raw,value=main

      - name: Build and push marp-collab image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Attest image
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/marp-collab
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
