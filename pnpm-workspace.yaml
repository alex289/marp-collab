packages:
  - frontend
  - backend
  - e2e
ignorePnpmfile: true
blockExoticSubdeps: true
minimumReleaseAge: 2880 # 2 days
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 5760 # 4 days
ignoreScripts: true
trustLockfile: true
publicHoistPattern:
  - "@shikijs/*"
# CodeMirror breaks silently when its core packages are loaded twice: the theme's
# syntaxHighlighting() and the language extension land on different facet instances,
# so the highlighter reads an empty syntax tree and nothing gets colored. Dependency
# bumps kept resolving these to two versions at once, so pin them to one copy each.
overrides:
  "@codemirror/language": "^6.12.4"
  "@codemirror/autocomplete": "^6.20.3"
  "@lezer/markdown": "^1.7.2"
allowBuilds:
  better-sqlite3: true
  integer: true
